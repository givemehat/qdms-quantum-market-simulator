name: Auto Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Modify last update
        run: |
          d=`date '+%Y-%m-%dT%H:%M:%SZ'`
          echo $d > LAST_UPDATED
          
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add LAST_UPDATED
          
          arr[0]="chore(bot): 😂 auto commit [skip ci]"
          arr[1]="chore(bot): 😱 auto commit [skip ci]"
          arr[2]="chore(bot): 👿 auto commit [skip ci]"
          arr[3]="chore(bot): 💩 auto commit [skip ci]"
          arr[4]="chore(bot): 🙏 auto commit [skip ci]"
          arr[5]="chore(bot): 🙈 auto commit [skip ci]"
          arr[6]="chore(bot): 🐐 auto commit [skip ci]"
          arr[7]="chore(bot): 🤖 auto commit [skip ci]"
          arr[8]="chore(bot): 🟩 auto commit [skip ci]"
          arr[9]="chore(bot): 👻 auto commit [skip ci]"
          
          rand=$[$RANDOM % ${#arr[@]}]
          
          git commit -m "${arr[$rand]}"
          git push
